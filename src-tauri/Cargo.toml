[package]
name = "antou-todo"
version = "1.0.0"
description = "案头清单 - 东方纸感待办清单"
authors = ["antou"]
edition = "2021"

[lib]
# 同时产出 staticlib/cdylib/rlib，供桌面与移动端入口复用
name = "antou_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
